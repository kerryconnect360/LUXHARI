{% extends 'admin/layout.html' %}{% block admin_content %}<div class="admin-top"><div><p class="eyebrow">CATALOGUE</p><h1>{{ 'Edit product' if product else 'New product' }}</h1></div></div><form class="admin-form admin-panel" method="post" enctype="multipart/form-data"><div class="form-grid"><label>Name<input name="name" value="{{ product.name if product else '' }}" required></label><label>Category<select name="category">{% for c in categories %}<option {% if product and product.category==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></label><label>Product type<input name="product_type" value="{{ product.product_type if product else 'Product' }}"></label><label>Price (KSh)<input name="price" type="number" step="0.01" min="0" value="{{ product.price if product else '' }}"></label><label>Stock / quantity<input name="stock" type="number" step="0.01" min="0" value="{{ product.stock if product else '' }}"></label><label>Unit label<input name="unit_label" value="{{ product.unit_label if product else 'item' }}" placeholder="item / metre / set"></label><label class="span-2">Sizes<input name="sizes" value="{{ product.sizes if product else '' }}" placeholder="S / M / L / XL"></label><label class="span-2">Description<textarea name="description" rows="5">{{ product.description if product else '' }}</textarea></label><label class="span-2">Upload image<input name="image" type="file" accept="image/*"></label><label class="span-2">External image URL <span class="muted">optional</span><input name="external_image" value="{{ product.external_image if product else '' }}"></label></div><div class="check-row"><label><input type="checkbox" name="featured" {% if product and product.featured %}checked{% endif %}> Featured on Discover</label><label><input type="checkbox" name="custom_order" {% if product and product.custom_order %}checked{% endif %}> Custom / Made to Order</label></div><button class="button primary">Save product</button><a class="button ghost" href="{{ url_for('admin.products') }}">Cancel</a></form>{% endblock %}
