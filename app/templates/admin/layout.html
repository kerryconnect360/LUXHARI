<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Authority · {{ site.get('site_name','LUXHARI') }}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/luxhari.css') }}"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"></head><body class="admin-body"><div class="admin-shell"><aside class="admin-side"><a class="admin-logo" href="{{ url_for('admin.dashboard') }}">LUXHARI <span>AUTHORITY</span></a><nav><a href="{{ url_for('admin.dashboard') }}">Dashboard</a><a href="{{ url_for('admin.products') }}">Products</a><a href="{{ url_for('admin.orders') }}">Orders</a><a href="{{ url_for('admin.settings') }}">Brand & Settings</a><a href="{{ url_for('public.home') }}">Open storefront</a></nav><a class="logout" href="{{ url_for('admin.logout') }}">Sign out</a></aside><main class="admin-main">{% with messages=get_flashed_messages(with_categories=true) %}{% if messages %}<div class="toast-stack">{% for category,msg in messages %}<div class="toast {{ category }}">{{ msg }}</div>{% endfor %}</div>{% endif %}{% endwith %}{% block admin_content %}{% endblock %}</main></div></body></html>
