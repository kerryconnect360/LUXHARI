{% extends 'base.html' %}
{% block content %}
<section class="container narrow-page checkout"><p class="eyebrow">CHECKOUT</p><h1>Complete your LUXHARI order.</h1><div class="checkout-grid"><div class="checkout-panel"><form method="post" action="{{ url_for('public.create_order') }}"><label>Name<input name="customer_name" required></label><label>Phone<input name="phone" required></label><label>Email<input name="email" type="email"></label><label>Delivery address<textarea name="address" rows="3"></textarea></label><label>Payment reference <span class="muted">optional until payment</span><input name="payment_reference" placeholder="e.g. MPESA123ABC"></label><button class="button primary full">I’ve Paid — Create Receipt</button></form></div><aside class="payment-panel"><p class="eyebrow">WHERE TO PAY</p><h3>Payment instructions</h3><p>{{ payment_instructions }}</p>{% if payment_image %}<img class="payment-image" src="{{ url_for('public.media', filename=payment_image) }}" alt="Where to pay">{% else %}<div class="payment-placeholder">Add the LUXHARI payment graphic from Authority → Settings.</div>{% endif %}</aside></div></section>
{% endblock %}
